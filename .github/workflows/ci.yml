name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Контракт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # Версия protoc фиксирована: в комментарии сгенерированного файла
      # указывается версия компилятора, и её расхождение с рабочей машиной
      # ломало бы проверку «совпадает ли код с .proto».
      - name: Установить protoc
        run: |
          curl -fsSL -o protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v36.0/protoc-36.0-linux-x86_64.zip"
          unzip -q protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      # Генераторы собираются из текущего модуля: их версии объявлены в
      # tools.go и зафиксированы в go.mod.
      - name: Собрать генераторы
        run: |
          go build -o "$HOME/protoc/bin/protoc-gen-go" google.golang.org/protobuf/cmd/protoc-gen-go
          go build -o "$HOME/protoc/bin/protoc-gen-go-grpc" google.golang.org/grpc/cmd/protoc-gen-go-grpc

      - name: Показать версии
        run: |
          protoc --version
          protoc-gen-go --version
          protoc-gen-go-grpc --version

      - name: Проверить, что сгенерированный код совпадает с .proto
        run: |
          for svc in auth apiToken video; do
            protoc -I proto "proto/$svc.proto" \
              --go_out="./gen/$svc" --go_opt=paths=source_relative \
              --go-grpc_out="./gen/$svc" --go-grpc_opt=paths=source_relative
          done
          if ! git diff --quiet -- gen; then
            echo "Сгенерированный код разошёлся с .proto:"
            git --no-pager diff --stat -- gen
            exit 1
          fi

      - name: Сборка и vet
        run: |
          go build ./...
          go vet ./...

      - name: Тесты
        run: go test -race ./...
