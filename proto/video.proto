syntax = "proto3";

// Контракт сервиса видео.

package video;

option go_package = "github.com/nikaydo/grpc-contract/gen/video";

service Video {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Add (AddRequest) returns (AddResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);

  // Stream отдаёт видео последовательностью сообщений, а не одним ответом
  // целиком. Метод был обычным unary: клиент загружал весь файл в память,
  // что ограничивало размер видео размером одного сообщения.
  rpc Stream (StreamRequest) returns (stream StreamResponse);
}

message StreamRequest {
  string uuid = 1;
}

message StreamResponse {
  bytes video = 1;
}

message GetRequest {
  // Идентификатор владельца. Раньше здесь передавался API-токен, и сервис
  // хранил его: токен попадал в базу, а проверки владельца не было — поиск шёл
  // только по названию, поэтому одноимённые видео разных пользователей
  // смешивались. Теперь токен проверяет шлюз, а сервис получает готовый
  // user_id.
  int32 user_id = 1;
  string video_name = 2;
  // Номер 3 раньше занимал token. Номер сохранён, чтобы не сдвинуть
  // нумерацию полей.
  reserved 3;
  reserved "token";
}

message SavedVideo {
  string uuid = 2;
  string title = 3;
}

message Videos {
  repeated SavedVideo video = 1;
}

message GetResponse {
  Videos video = 1;
}

message Tags {
  repeated string tag = 1;
}

message AddRequest {
  int32 user_id = 1;
  bytes video = 2;
  string name = 3;
  Tags tags = 4;
  // Номер 5 раньше занимал token.
  reserved 5;
  reserved "token";
}

message AddResponse {
  bool result = 1;
}

message DeleteRequest {
  // Идентификатор владельца обязателен: без него видео можно было удалить по
  // одному только uuid, без проверки владельца.
  int32 user_id = 1;
  string uuid = 2;
}

message DeleteResponse {
  bool result = 1;
}