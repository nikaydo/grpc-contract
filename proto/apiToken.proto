syntax = "proto3";

// Контракт сервиса API-токенов.

package apiToken;

option go_package = "github.com/nikaydo/grpc-contract/gen/apiToken";

// Имя сервиса приведено к PascalCase: имена в нижнем регистре не
// соответствуют соглашениям protobuf и плохо читаются в трассировках.
service ApiToken {
  rpc Create (CreateRequest) returns (CreateResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Verify (VerifyRequest) returns (VerifyResponse);
}

message CreateRequest {
  // Переименовано из id в user_id: значение однозначно указывает
  // владельца токена, а не запись в таблице.
  int32 user_id = 1;
}

message CreateResponse {
  string token = 1;
}

message DeleteRequest {
  // user_id обязателен: без него токен можно было бы удалить у другого
  // владельца, просто зная его значение.
  int32 user_id = 1;
  string token = 2;
}

message DeleteResponse {
  bool result = 1;
}

message GetRequest {
  int32 user_id = 1;
}

message Tokens {
  repeated string tokens = 1;
}

message GetResponse {
  Tokens tokens = 1;
}

message VerifyRequest {
  string token = 1;
}

message VerifyResponse {
  bool result = 1;
}